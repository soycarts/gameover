<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAMEOVER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=JetBrains+Mono:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
/* ===================================================================
   THEME — everything a restyler needs is in this block.
   Change colours / fonts / sizes here, not in the rules below.
   =================================================================== */
:root {
  /* palette */
  --bg:            #07080b;
  --ink:           #f4f7fa;
  --ink-dim:       #6f7987;
  --steel:         #5f6b7a;
  --accent:        #ffd23f;   /* arcade gold: titles, VS, stamps */
  --accent-2:      #ff2d4d;   /* danger / KO red */
  --left-color:    #29d3ff;   /* player 1 identity */
  --right-color:   #ff7b29;   /* player 2 identity */
  --ghost:         #ffffff66; /* trailing damage inside a core */
  --core-hollow:   #0d1015;   /* unlit core interior */
  --core-edge:     #e4ebf3;   /* robot-head outline pixels */
  --panel:         #12151be6;
  --panel-edge:    #ffffff22;
  --comment-bg:    #10152acc;
  --ko-panel:      #0a0204b8; /* KO stamp plate */
  --ko-glow:       #ff2d4d8c;
  --ko-ink-shadow: #b3260f;   /* hard pixel shadow under the stamp text */
  --embers:        #ffe27a,#ff9d3d,#ff5a1a,#ff3d1a;

  /* health ramp — sampled by JS, interpolated per hp */
  --ramp-0:        255,45,77;    /* critical */
  --ramp-25:       255,157,61;
  --ramp-50:       255,217,61;
  --ramp-75:       168,255,61;
  --ramp-100:      61,255,158;   /* healthy */

  /* type */
  --font-display:  'Orbitron', sans-serif;                     /* names, status, VS */
  --font-mono:     'JetBrains Mono', ui-monospace, monospace;  /* numbers, labels */
  --font-pixel:    'Press Start 2P', 'Courier New', monospace; /* title, stamps */
  --fs-title:      clamp(28px, 7vw, 76px);
  --fs-name:       clamp(11px, 1.7vw, 22px);
  --fs-hp:         clamp(13px, 2vw, 26px);
  --fs-status:     clamp(7px, 1vw, 13px);
  --fs-caption:    clamp(10px, 1.8vw, 20px);
  --fs-comment:    clamp(8px, 1.1vw, 12px);
  --fs-stamp:      clamp(26px, 7vw, 92px);

  /* layout */
  --core-size:     clamp(30px, 5.4vw, 78px);   /* width of one robot-head core */
  --core-gap:      clamp(4px, .9vw, 14px);
  --bar-w:         clamp(150px, 30vw, 520px);  /* column width for each side */
  --hud-pad:       clamp(12px, 2.4vw, 34px);
  --radius:        3px;
  /* Broadcast footage puts its own graphics in the TOP-LEFT (match clock,
     "KNOCKOUT : 72sec" banner), so the HUD keeps that corner empty: bars run
     along the bottom and the only top-anchored readouts hug the right edge.
     Raise --safe-top if a broadcaster's band spans the full width. */
  --safe-top:      var(--hud-pad);

  /* motion */
  --tween:         400ms;      /* health drain tween (spec) */
  --ghost-tween:   900ms;
  --shake-time:    420ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font-family: var(--font-mono); overflow: hidden; }

/* ---------- stage ---------- */
#stage { position: fixed; inset: 0; }
#video, #placeholder { position: absolute; inset: 0; width: 100%; height: 100%; }
#video { object-fit: cover; background: #000; }
#placeholder { display: none; background:
  radial-gradient(ellipse at 50% 40%, #1b2340 0%, #05060a 70%),
  repeating-linear-gradient(90deg, #ffffff08 0 2px, transparent 2px 46px); }
#placeholder.on { display: block; }
#placeholder::after { content: 'DEMO ARENA — no clip loaded'; position: absolute;
  left: 0; right: 0; top: 52%; text-align: center; color: var(--ink-dim);
  font-size: var(--fs-comment); letter-spacing: 2px; }

/* shake on big damage */
@keyframes shake {
  0%,100% { transform: translate(0,0) }
  20% { transform: translate(-12px, 7px) rotate(-.5deg) }
  40% { transform: translate(11px, -8px) rotate(.5deg) }
  60% { transform: translate(-8px, -5px) }
  80% { transform: translate(7px, 6px) }
}
#stage.shake { animation: shake var(--shake-time) linear; }
/* KO hits harder — vintage hardware doesn't ease */
@keyframes shakeHard {
  0%,100% { transform: translate(0,0) rotate(0) }
  15% { transform: translate(-18px, 10px) rotate(-.8deg) }
  35% { transform: translate(17px, -12px) rotate(.8deg) }
  55% { transform: translate(-14px, -8px) rotate(-.5deg) }
  75% { transform: translate(12px, 9px) rotate(.4deg) }
}
#stage.shake-hard { animation: shakeHard .5s cubic-bezier(.36,.07,.19,.97); }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; opacity: 0;
  transition: opacity 500ms; }
#hud.on { opacity: 1; }

/* one bottom row: left stack · caption · right stack — the top of the frame
   belongs to the broadcaster (see --safe-top). */
.bars { position: absolute; bottom: var(--hud-pad); left: var(--hud-pad);
  right: var(--hud-pad); display: flex; justify-content: space-between;
  align-items: flex-end; gap: clamp(10px, 3vw, 44px); }
.side { display: flex; flex-direction: column; gap: 6px;
  flex: 0 1 var(--bar-w); min-width: 0; max-width: 46%; }
.side.right { align-items: flex-end; }

.name { font-family: var(--font-display); font-weight: 800; font-size: var(--fs-name);
  letter-spacing: .06em; text-shadow: 2px 2px 0 #000, 0 0 14px #000; }
.side.left  .name { color: var(--left-color); }
.side.right .name { color: var(--right-color); }

/* ---------- pixel cores (health) ----------
   Five robot heads per bot, 20 hp each. The last one drains first, so damage
   eats inward toward the centre of the frame. Each head is a plain div whose
   width tweens; the robot silhouette comes from a CSS mask, so there are no
   SVG ids to collide between the two sides. */
.cores { display: flex; gap: var(--core-gap); }
.side.right .cores { flex-direction: row-reverse; }

.core { position: relative; width: var(--core-size); aspect-ratio: 11 / 9;
  filter: drop-shadow(0 0 8px var(--glow, #3dff9e66));
  transition: filter 300ms; }
.core.spent { filter: none; }
.core-body, .core-edge { position: absolute; inset: 0; }
.core-body {
  -webkit-mask: var(--core-mask) center / 100% 100% no-repeat;
          mask: var(--core-mask) center / 100% 100% no-repeat; }
.core-edge { background: var(--core-edge);
  -webkit-mask: var(--core-edge-mask) center / 100% 100% no-repeat;
          mask: var(--core-edge-mask) center / 100% 100% no-repeat; }
.core-hollow { position: absolute; inset: 0; background: var(--core-hollow); }
/* the drain sweeps the head's INTERIOR columns, not its bounding box — otherwise
   the outer ~18% of the sweep lands on empty pixels and a 20% core reads as 0 */
.core-ghost, .core-fill { position: absolute; top: 0; bottom: 0;
  left: var(--core-in-x); width: 0; }
.core-ghost { background: var(--ghost);
  transition: width var(--ghost-tween) ease-out 220ms; }
.core-fill { background: var(--live-color, #3dff9e);
  transition: width var(--tween) cubic-bezier(.2,.8,.2,1), background 300ms; }
.side.right .core-ghost, .side.right .core-fill { left: auto; right: var(--core-in-x); }

@keyframes corePop {
  0% { transform: scale(1) }
  35% { transform: scale(1.22) rotate(-3deg) }
  100% { transform: scale(1) }
}
.core.pop { animation: corePop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes coreThrob {
  0%,100% { transform: scale(1); filter: drop-shadow(0 0 7px var(--glow, #ff2d4d99)) }
  50% { transform: scale(1.09); filter: drop-shadow(0 0 20px var(--glow, #ff2d4d99)) }
}
.core.low { animation: coreThrob .8s ease-in-out infinite; }

/* readout + status line */
.readout { display: flex; align-items: baseline; gap: 10px;
  text-shadow: 2px 2px 0 #000; }
.side.right .readout { flex-direction: row-reverse; }
.hpnum { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-hp);
  color: var(--live-color, var(--ink)); transition: color 300ms; }
.coren { font-family: var(--font-mono); font-size: var(--fs-status);
  letter-spacing: .08em; color: var(--steel); }
.coren b { color: var(--ink); font-weight: 500; }
.status { font-family: var(--font-display); font-weight: 600;
  font-size: var(--fs-status); letter-spacing: .24em;
  color: var(--live-color, var(--ink)); text-shadow: 2px 2px 0 #000, 0 0 12px #000;
  transition: color 300ms; }

/* fan comment — order:-1 floats it ABOVE the bottom-anchored cores */
.comment { order: -1; max-width: 100%; background: var(--comment-bg);
  border-left: 3px solid var(--accent); padding: 8px 10px; margin-top: 4px;
  font-size: var(--fs-comment); line-height: 1.6; opacity: 0;
  transform: translateY(10px); transition: opacity 260ms, transform 260ms; }
.side.right .comment { border-left: 0; border-right: 3px solid var(--accent);
  text-align: right; }
.comment.on { opacity: 1; transform: translateY(0); }
.comment .src { display: block; margin-top: 6px; color: var(--ink-dim);
  font-size: .82em; overflow-wrap: anywhere; }

/* caption — centre column of the bottom row */
#caption { flex: 1 1 auto; min-width: 0; text-align: center;
  overflow-wrap: break-word; padding-bottom: 4px;
  font-family: var(--font-pixel); font-size: var(--fs-caption);
  line-height: 1.7; text-shadow: 3px 3px 0 #000, 0 0 18px #000; }
/* too narrow for three columns — caption takes its own line above the bars */
@media (max-width: 620px) {
  .bars { flex-wrap: wrap; }
  #caption { order: -2; flex: 1 0 100%; padding-bottom: 10px; }
}
#caption::after { content: '_'; opacity: .8; animation: blink 700ms steps(1) infinite; }
#caption.done::after { content: ''; }

/* hit counter + massive damage */
#hits { position: absolute; right: var(--hud-pad); top: var(--safe-top);
  font-family: var(--font-mono); font-weight: 700;
  font-size: var(--fs-comment); letter-spacing: .18em; color: var(--accent);
  text-shadow: 2px 2px 0 #000; }
#muted { position: absolute; right: var(--hud-pad);
  top: calc(var(--safe-top) + var(--fs-comment) + 14px);
  font-size: var(--fs-comment); color: var(--ink-dim); display: none;
  pointer-events: auto; cursor: pointer; text-align: right;
  max-width: min(60vw, 420px); line-height: 1.7; }
#muted.on { display: block; }
#massive { position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%) scale(.6);
  font-family: var(--font-pixel); font-size: clamp(18px, 4.4vw, 54px);
  color: var(--accent-2); text-shadow: 4px 4px 0 #000; opacity: 0; }
#massive.on { animation: massive 900ms ease-out; }
@keyframes massive {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(.4) }
  18% { opacity: 1; transform: translate(-50%,-50%) scale(1.15) }
  70% { opacity: 1; transform: translate(-50%,-50%) scale(1) }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1) }
}

/* damage floaters + KO embers */
.floater { position: absolute; font-family: var(--font-display); font-weight: 800;
  font-size: clamp(14px, 2.2vw, 28px); color: var(--accent-2);
  text-shadow: 0 0 10px var(--ko-glow), 2px 2px 0 #000; pointer-events: none;
  z-index: 9; animation: floatUp 1s ease forwards; }
@keyframes floatUp {
  0% { opacity: 0; transform: translateY(6px) scale(.8) }
  20% { opacity: 1; transform: translateY(-4px) scale(1.1) }
  100% { opacity: 0; transform: translateY(-46px) scale(1) }
}
.ember { position: absolute; width: 5px; height: 5px; border-radius: 1px;
  pointer-events: none; z-index: 9; animation: emberOut .7s ease-out forwards; }
@keyframes emberOut {
  0% { transform: translate(0,0) scale(1); opacity: 1 }
  100% { transform: translate(var(--dx), var(--dy)) scale(.15); opacity: 0 }
}

/* ---------- screens (title / game over) ---------- */
.screen { position: absolute; inset: 0; display: none; flex-direction: column;
  align-items: center; justify-content: center; gap: 26px; text-align: center;
  background: #05060aee; z-index: 5; }
.screen.on { display: flex; }
#title h1 { font-family: var(--font-pixel); font-size: var(--fs-title); margin: 0;
  color: var(--accent); text-shadow: 6px 6px 0 var(--accent-2); letter-spacing: 4px; }
#title .sub { color: var(--ink-dim); font-size: var(--fs-comment); letter-spacing: 3px; }
#coin { font-family: var(--font-pixel); font-size: var(--fs-comment); color: var(--ink);
  animation: blink 900ms steps(1) infinite; }
@keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

.vs { display: flex; align-items: center; gap: clamp(14px, 4vw, 48px);
  border: 3px solid var(--panel-edge); background: var(--panel);
  padding: clamp(12px, 2.4vw, 26px) clamp(16px, 4vw, 44px); }
.vs .bot { font-family: var(--font-display); font-weight: 800;
  font-size: var(--fs-name); letter-spacing: .06em; max-width: 30vw; }
.vs .bot.l { color: var(--left-color); }
.vs .bot.r { color: var(--right-color); }
.vs .mid { font-family: var(--font-pixel); font-size: clamp(18px,3.4vw,40px);
  color: var(--accent); text-shadow: 3px 3px 0 var(--accent-2); }

/* era B url box */
#erab { pointer-events: auto; display: flex; flex-direction: column; gap: 10px;
  align-items: center; }
#erab input { font-family: var(--font-mono); font-size: 12px; padding: 10px 12px;
  width: min(70vw, 520px); background: #000; color: var(--ink);
  border: 2px solid var(--panel-edge); }
#cmd { font-size: var(--fs-comment); color: var(--accent); background: #000;
  border: 2px dashed var(--panel-edge); padding: 10px; display: none;
  width: min(70vw, 520px); word-break: break-all; line-height: 1.7;
  user-select: all; }

/* ---------- KO: fireball, smoke, stamp ---------- */
#flash { position: absolute; inset: 0; background: #fff; opacity: 0;
  pointer-events: none; z-index: 6; }
#flash.on { animation: flash 620ms ease-out; }
@keyframes flash { 0% { opacity: .95 } 100% { opacity: 0 } }

#ko { position: absolute; inset: 0; display: flex; align-items: center;
  justify-content: center; pointer-events: none; opacity: 0; overflow: hidden;
  z-index: 7; }
#ko.on { opacity: 1; }
#ko::before { content: ''; position: absolute; width: 70%; height: 220%;
  border-radius: 50%; opacity: 0; transform: scale(.1); }
#ko.on::before { animation: fireball 1s ease-out forwards; }
@keyframes fireball {
  0% { opacity: 0; transform: scale(.08);
    background: radial-gradient(circle, #fff 0%, #fff3c4 10%, #ffb347 26%, #ff5a1a 42%, #b3260f 58%, #3c140f80 70%, transparent 80%) }
  12% { opacity: 1; transform: scale(.55) }
  30% { opacity: 1; transform: scale(1);
    background: radial-gradient(circle, #fff3c4 0%, #ffcf6b 14%, #ff8a3d 30%, #ff3d1a 48%, #7a1c0a 66%, #28141466 76%, transparent 84%) }
  55% { opacity: .9; transform: scale(1.28);
    background: radial-gradient(circle, #ffe0a080 0%, #ff782873 22%, #96281466 42%, #32191666 64%, transparent 80%) }
  100% { opacity: 0; transform: scale(1.55) }
}
#ko::after { content: ''; position: absolute; width: 85%; height: 85%;
  border-radius: 50%; opacity: 0; filter: blur(2px);
  background: radial-gradient(circle, #4644428c 0%, #28262566 40%, transparent 72%); }
#ko.on::after { animation: smokeRise 1.6s ease-out .2s forwards; }
@keyframes smokeRise {
  0% { opacity: 0; transform: translateY(10%) scale(.5) }
  20% { opacity: .85; transform: translateY(0) scale(.9) }
  100% { opacity: 0; transform: translateY(-45%) scale(1.6) }
}

.stamp { position: relative; z-index: 2; text-align: center;
  padding: clamp(10px, 2vw, 22px) clamp(16px, 3vw, 34px);
  background: var(--ko-panel); border: 3px solid var(--accent-2);
  box-shadow: 0 0 0 3px var(--ko-panel), 0 0 32px var(--ko-glow);
  transform: scale(0); opacity: 0; image-rendering: pixelated; }
/* CRT scanlines across the panel */
.stamp::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(180deg, #00000052 0 2px, transparent 2px 4px);
  mix-blend-mode: multiply; }
#ko.on .stamp { animation: stampIn .42s .55s steps(4, end) forwards; }
@keyframes stampIn {
  0% { transform: scale(.2); opacity: 0 }
  60% { transform: scale(1.12); opacity: 1 }
  100% { transform: scale(1); opacity: 1 }
}
.stamp .go { display: block; font-family: var(--font-pixel);
  font-size: var(--fs-stamp); line-height: 1.25; letter-spacing: .04em; color: #fff;
  /* hard pixel drop-shadow, no blur — reads like a CRT sprite */
  text-shadow: 3px 3px 0 var(--ko-ink-shadow), 6px 6px 0 #000000a6, 0 0 18px var(--ko-glow); }
#ko.on .go { animation: goFlicker 1.1s steps(1, end) .7s 3; }
@keyframes goFlicker { 0%,44%,100% { opacity: 1 } 46%,52% { opacity: .35 } }

/* the loser's cores wink out under the blast */
.cores.dead { opacity: 0; transform: scale(.82); filter: blur(1.5px);
  transition: opacity .4s ease .28s, transform .4s ease .28s, filter .4s ease .28s; }

#over h2 { font-family: var(--font-pixel); font-size: clamp(22px,6vw,64px);
  color: var(--accent-2); margin: 0; text-shadow: 5px 5px 0 #000; }
#over .winner { font-family: var(--font-display); font-weight: 800;
  font-size: var(--fs-name); letter-spacing: .06em; color: var(--accent); }
#stats { border: 3px solid var(--panel-edge); background: var(--panel);
  padding: 18px 24px; font-size: var(--fs-comment); line-height: 2.1;
  text-align: left; min-width: min(78vw, 420px); }
#stats b { color: var(--accent); }
.hint { color: var(--ink-dim); font-size: var(--fs-comment); letter-spacing: 1px; }

/* CRT filter (toggle "c") */
#crt { position: absolute; inset: 0; pointer-events: none; z-index: 8; display: none;
  background: repeating-linear-gradient(0deg, #0000 0 2px, #00000059 2px 4px);
  box-shadow: inset 0 0 180px #000c; }
#crt.on { display: block; }

/* rainbow easter egg ("g") */
body.rainbow .core-fill { background: linear-gradient(90deg,#ff2e63,#ffd23f,#3fff8a,#29d3ff,#c93fff) !important;
  background-size: 400% 100%; animation: rb 1.4s linear infinite; }
@keyframes rb { to { background-position: 400% 0 } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>

<div id="stage">
  <video id="video" playsinline></video>
  <div id="placeholder"></div>

  <div id="hud">
    <div class="bars">
      <div class="side left" id="sideL">
        <div class="name" id="nameL">—</div>
        <div class="cores" id="coresL"></div>
        <div class="readout">
          <span class="hpnum" id="hpL">100</span>
          <span class="coren"><b id="cnL">5</b> / 5 CORES</span>
        </div>
        <div class="status" id="stL">SYSTEMS NOMINAL</div>
        <div class="comment" id="cmtL"></div>
      </div>
      <div id="caption"></div>
      <div class="side right" id="sideR">
        <div class="name" id="nameR">—</div>
        <div class="cores" id="coresR"></div>
        <div class="readout">
          <span class="hpnum" id="hpR">100</span>
          <span class="coren"><b id="cnR">5</b> / 5 CORES</span>
        </div>
        <div class="status" id="stR">SYSTEMS NOMINAL</div>
        <div class="comment" id="cmtR"></div>
      </div>
    </div>
    <div id="hits"></div>
    <div id="muted">🔇 MUTED — CLICK TO UNMUTE</div>
    <div id="massive">MASSIVE DAMAGE</div>
  </div>

  <div id="flash"></div>
  <div id="ko"><div class="stamp"><span class="go">K.O.</span></div></div>

  <div class="screen on" id="title">
    <h1>GAMEOVER</h1>
    <div class="sub">ROBOT COMBAT / VISION-JUDGED</div>
    <div class="vs">
      <div class="bot l" id="vsL">BOT A</div>
      <div class="mid">VS</div>
      <div class="bot r" id="vsR">BOT B</div>
    </div>
    <div id="coin">INSERT COIN — PRESS ANY KEY</div>
    <div id="erab">
      <input id="url" placeholder="paste a YouTube fight URL (era B)" autocomplete="off">
      <div id="cmd"></div>
    </div>
  </div>

  <div class="screen" id="over">
    <h2>GAME OVER</h2>
    <div class="winner" id="winner"></div>
    <div id="stats"></div>
    <div class="hint">R — REPLAY &nbsp;·&nbsp; C — CRT</div>
  </div>

  <div id="crt"></div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const CLIP = qs.get('clip') || 'synthfight';
const DEMO = qs.get('demo') === '1';

const SHAKE_AT = 15, MASSIVE_AT = 20;
const CORES = 5, HP_PER_CORE = 100 / CORES;
let EMBERS = [];

let timeline = null, events = [], sources = {},   // comment text -> source label
    applied = -1, started = false, koDone = false,
    virtualClock = false, vStart = 0, useVideo = true, duration = 60,
    hits = 0, audio = null;

/* ---------------- pixel cores ----------------
   '#' = outline pixel, 'o' = fillable interior, '.' = empty.
   Both masks are built once and handed to CSS as variables, so the two bots
   share one silhouette and there are no per-instance SVG ids to collide. */
const PX_MAP = [
  ".....#.....",
  ".....#.....",
  ".#########.",
  ".#ooooooo#.",
  "##o#ooo#o##",
  ".#ooooooo#.",
  ".#o#####o#.",
  ".#ooooooo#.",
  ".#########."
];

/* interior column band, as percentages of the head's width — the drain sweeps
   this range so a 20%-full core actually shows a fifth of the face lit */
const PX_COLS = PX_MAP[0].length;
const IN_COLS = PX_MAP.reduce((a, row) => {
  for (let x = 0; x < row.length; x++)
    if (row[x] === 'o') { a[0] = Math.min(a[0], x); a[1] = Math.max(a[1], x); }
  return a;
}, [PX_COLS, -1]);
const IN_X = IN_COLS[0] / PX_COLS * 100;
const IN_W = (IN_COLS[1] - IN_COLS[0] + 1) / PX_COLS * 100;

function maskURI(ch) {
  const w = PX_MAP[0].length, h = PX_MAP.length;
  let rects = '';
  PX_MAP.forEach((row, y) => {
    for (let x = 0; x < row.length; x++)
      if (row[x] === ch) rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  });
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" ` +
              `shape-rendering="crispEdges" fill="#fff">${rects}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}

/* health ramp — stops live in :root so a restyle never touches this block */
let RAMP = [];
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  RAMP = [0, 25, 50, 75, 100].map(at => ({
    at, c: cs.getPropertyValue(`--ramp-${at}`).split(',').map(n => +n)
  }));
  EMBERS = cs.getPropertyValue('--embers').split(',').map(s => s.trim());
}
function healthColor(v) {
  v = Math.max(0, Math.min(100, v));
  for (let i = 0; i < RAMP.length - 1; i++) {
    const a = RAMP[i], b = RAMP[i + 1];
    if (v >= a.at && v <= b.at) {
      const t = (v - a.at) / (b.at - a.at);
      return [0, 1, 2].map(k => Math.round(a.c[k] + (b.c[k] - a.c[k]) * t));
    }
  }
  return RAMP[RAMP.length - 1].c;
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function statusFor(v) {
  if (v <= 0)  return 'CORE DESTROYED';
  if (v <= 14) return 'CRITICAL — EJECT';
  if (v <= 34) return 'SYSTEMS FAILING';
  if (v <= 54) return 'ARMOR DAMAGED';
  if (v <= 74) return 'MINOR SCUFFING';
  return 'SYSTEMS NOMINAL';
}

/* fraction of core i (0-based) still lit at total hp v — the last core drains
   first, so damage eats inward toward the centre of the frame */
const coreFrac = (v, i) => Math.max(0, Math.min(1, (v - i * HP_PER_CORE) / HP_PER_CORE));

function buildCores() {
  const root = document.documentElement;
  root.style.setProperty('--core-mask', maskURI('o'));
  root.style.setProperty('--core-edge-mask', maskURI('#'));
  root.style.setProperty('--core-in-x', IN_X + '%');
  ['L', 'R'].forEach(s => {
    $('cores' + s).innerHTML = Array.from({length: CORES}, () =>
      `<div class="core"><div class="core-body">` +
      `<div class="core-hollow"></div><div class="core-ghost"></div>` +
      `<div class="core-fill"></div></div><div class="core-edge"></div></div>`).join('');
  });
}

/* ---------------- data ---------------- */
async function loadJSON(url) {
  const r = await fetch(url, {cache: 'no-store'});
  if (!r.ok) throw new Error(url + ' -> ' + r.status);
  return r.json();
}

async function boot() {
  readTheme();
  buildCores();
  const tlUrl = DEMO ? '../demo/fight1.json' : `../timelines/${CLIP}.json`;
  try {
    timeline = await loadJSON(tlUrl);
  } catch (e) {
    $('title').innerHTML = `<h1>NO TIMELINE</h1><div class="sub">${tlUrl}</div>
      <div class="hint">run: python backend/analyze.py ${CLIP}.mp4</div>`;
    return;
  }
  events = (timeline.events || []).slice().sort((a, b) => a.t - b.t);
  duration = (events.length ? events[events.length - 1].t : 30) + 4;

  // source labels for fan comments (contract keeps only the text)
  try {
    const cs = await loadJSON(`../comments/${DEMO ? 'fight1' : CLIP}.json`);
    cs.forEach(c => { sources[norm(c.text)] = c.source; });
  } catch (e) { /* optional */ }

  $('nameL').textContent = $('vsL').textContent = timeline.bots?.left  || 'BOT A';
  $('nameR').textContent = $('vsR').textContent = timeline.bots?.right || 'BOT B';

  const src = `../clips/${timeline.clip || CLIP + '.mp4'}`;
  const v = $('video');
  v.addEventListener('error', fallbackClock);
  v.addEventListener('loadedmetadata', () => { duration = v.duration || duration; });
  v.src = src;
  render(events[0] || {left_hp: 100, right_hp: 100});
}

const norm = s => (s || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').trim();
function fallbackClock() {
  useVideo = false;
  $('placeholder').classList.add('on');
  if (started && !virtualClock) { virtualClock = true; vStart = performance.now(); }
}

/* Autoplay policies can leave the video paused WITHOUT rejecting play(), which
   would freeze the whole HUD at t=0. Watch the clock; retry muted, then give up
   to the virtual clock so the fight always runs. */
function watchdog() {
  const v = $('video'), t0 = v.currentTime;
  const stalled = () => $('video').currentTime <= t0 + 0.05;
  setTimeout(() => {
    if (!started || !useVideo || !stalled()) return;
    v.muted = true;
    $('muted').classList.add('on');
    v.play().catch(() => {});
    setTimeout(() => { if (started && useVideo && stalled()) fallbackClock(); }, 900);
  }, 1200);
}

/* ---------------- engine ---------------- */
function now() {
  if (useVideo) return $('video').currentTime;
  return virtualClock ? (performance.now() - vStart) / 1000 : 0;
}

function indexAt(t) {
  let i = -1;
  for (let k = 0; k < events.length; k++) if (events[k].t <= t + 1e-6) i = k; else break;
  return i;
}

function tick() {
  requestAnimationFrame(tick);
  if (!started || !events.length) return;
  const t = now(), i = indexAt(t);

  if (i < applied) {                    // scrubbed backwards — re-derive, fire nothing
    applied = i; hits = 0; koDone = false;
    $('ko').classList.remove('on'); $('over').classList.remove('on');
    $('hits').textContent = ''; hideComments(); clearTransients();
    ['L','R'].forEach(s => $('cores' + s).classList.remove('dead'));
    if (i >= 0) { render(events[i]); typeCaption(events[i].caption || ''); }
    else { render({left_hp: 100, right_hp: 100}); $('caption').textContent = ''; }
  } else while (i > applied) {           // fire each crossed event exactly once
    applied++;
    fire(events[applied], applied > 0 ? events[applied - 1] : null);
  }

  if (!useVideo && t > duration && !koDone) finish();
}

/* one-shots only — never called on a backward scrub */
function fire(ev, prev) {
  const prevL = prev ? prev.left_hp  : 100, prevR = prev ? prev.right_hp : 100;
  render(ev);
  const dl = prev ? prevL - ev.left_hp  : 0;
  const dr = prev ? prevR - ev.right_hp : 0;
  const drop = Math.max(dl, dr);
  const side = dl >= dr ? 'L' : 'R';

  if (dl > 0) { popCores('L', prevL, ev.left_hp);  floatDamage('L', dl); }
  if (dr > 0) { popCores('R', prevR, ev.right_hp); floatDamage('R', dr); }

  if (ev.caption) typeCaption(ev.caption);
  if (ev.fan_comment) showComment(side, ev.fan_comment);

  if (drop > 0) { hits++; $('hits').textContent = `HITS ${String(hits).padStart(2, '0')}`; }
  if (drop >= SHAKE_AT) { shake(false); sfx('hit'); }
  if (drop >= MASSIVE_AT) {
    const m = $('massive');
    m.classList.remove('on'); void m.offsetWidth; m.classList.add('on');
  }
  if (ev.ko) koSequence(ev.ko);
}

/* idempotent — safe to call at any time, any number of times */
function render(ev) {
  setSide('L', ev.left_hp ?? 100);
  setSide('R', ev.right_hp ?? 100);
}

function setSide(s, hp) {
  hp = Math.max(0, Math.min(100, hp | 0));
  const col = healthColor(hp), side = $('side' + s);
  side.style.setProperty('--live-color', rgb(col));
  side.style.setProperty('--glow', rgba(col, .45));

  $('cores' + s).querySelectorAll('.core').forEach((core, i) => {
    const frac = coreFrac(hp, i), w = frac * IN_W + '%';
    core.querySelector('.core-fill').style.width = w;
    core.querySelector('.core-ghost').style.width = w;
    core.classList.toggle('spent', frac === 0);
    core.classList.toggle('low', hp <= 20 && frac > 0);
  });

  $('hp' + s).textContent = hp;
  $('cn' + s).textContent = Math.ceil(hp / HP_PER_CORE);
  $('st' + s).textContent = statusFor(hp);
}

/* a core that just emptied gets a one-shot pop */
function popCores(s, from, to) {
  $('cores' + s).querySelectorAll('.core').forEach((core, i) => {
    if (coreFrac(from, i) > 0 && coreFrac(to, i) === 0) {
      core.classList.remove('pop'); void core.offsetWidth; core.classList.add('pop');
    }
  });
}

function shake(hard) {
  const st = $('stage'), c = hard ? 'shake-hard' : 'shake';
  st.classList.remove('shake', 'shake-hard'); void st.offsetWidth; st.classList.add(c);
}

/* ---------------- transients (floaters + embers) ---------------- */
function clearTransients() {
  $('stage').querySelectorAll('.floater, .ember').forEach(el => el.remove());
}

function spawn(el, ms) {
  $('stage').appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* place relative to a side's core row, in stage coordinates. Floaters hang off
   the row's inner edge so they rise beside the faces instead of over them. */
function anchor(s, inner) {
  const r = $('cores' + s).getBoundingClientRect();
  const st = $('stage').getBoundingClientRect();
  const x = inner ? (s === 'L' ? r.right : r.left) : r.left + r.width / 2;
  return {x: x - st.left, y: r.top - st.top + r.height / 2};
}

function floatDamage(s, dmg) {
  const a = anchor(s, true), el = document.createElement('div');
  el.className = 'floater';
  el.textContent = '-' + dmg;
  el.style.left = a.x + 'px';
  el.style.top = (a.y + 28) + 'px';
  spawn(el, 1000);
}

function spawnEmbers(s, count) {
  const a = anchor(s, false);
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div'), ang = Math.random() * Math.PI * 2,
          dist = 50 + Math.random() * 80;
    el.className = 'ember';
    el.style.left = (a.x + (Math.random() - .5) * 60) + 'px';
    el.style.top  = (a.y + (Math.random() - .5) * 40) + 'px';
    const c = EMBERS[(Math.random() * EMBERS.length) | 0];
    el.style.background = c;
    el.style.boxShadow = `0 0 8px 1px ${c}`;
    el.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    el.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    spawn(el, 780);
  }
}

/* typing caption */
let typeTimer = null;
function typeCaption(text) {
  clearInterval(typeTimer);
  const el = $('caption');
  el.textContent = ''; el.classList.remove('done');
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(typeTimer); el.classList.add('done'); }
  }, 34);
}

function hideComments() { ['L','R'].forEach(s => $('cmt' + s).classList.remove('on')); }
function showComment(side, text) {
  const el = $('cmt' + side);
  const source = sources[norm(text)] || 'reddit';
  const label = source === 'youtube' ? 'via YouTube comments' : 'via r/battlebots';
  el.innerHTML = `“${escapeHTML(text)}”<span class="src">${label}</span>`;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 6000);
}
const escapeHTML = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- KO / game over ---------------- */
function koSequence(loser) {
  if (koDone) return;
  koDone = true;
  const s = loser === 'left' ? 'L' : 'R';
  const v = $('video');
  if (useVideo) v.pause();
  sfx('ko');
  setTimeout(() => {                        // 1s freeze-frame, then blast + stamp
    $('flash').classList.remove('on'); void $('flash').offsetWidth;
    $('flash').classList.add('on');
    $('ko').classList.add('on');
    $('cores' + s).classList.add('dead');
    spawnEmbers(s, 22);
    shake(true);
    setTimeout(() => finish(loser), 1800);
  }, 1000);
}

function finish(loser) {
  const last = events[events.length - 1] || {left_hp: 100, right_hp: 100};
  if (!loser) loser = last.left_hp === last.right_hp ? null
                    : (last.left_hp < last.right_hp ? 'left' : 'right');
  const names = {left: timeline.bots?.left || 'BOT A', right: timeline.bots?.right || 'BOT B'};
  const winner = loser ? (loser === 'left' ? names.right : names.left) : 'DRAW';
  $('winner').textContent = loser ? `WINNER: ${winner}` : 'DRAW';
  $('stats').innerHTML = statsCard(names, last);
  $('over').classList.add('on');
  $('ko').classList.remove('on');
  if (useVideo) $('video').pause();
}

function statsCard(names, last) {
  let bigL = 0, bigR = 0, hitsL = 0, hitsR = 0;
  for (let i = 1; i < events.length; i++) {
    const dl = events[i - 1].left_hp - events[i].left_hp;
    const dr = events[i - 1].right_hp - events[i].right_hp;
    if (dl > 0) { hitsR++; bigL = Math.max(bigL, dl); }   // damage TO left = hit BY right
    if (dr > 0) { hitsL++; bigR = Math.max(bigR, dr); }
  }
  const dur = events.length ? events[events.length - 1].t.toFixed(1) : '0.0';
  return `
    <div><b>FIGHT TIME</b> ${dur}s</div>
    <div><b>${escapeHTML(names.left)}</b> — hp ${last.left_hp} · hits landed ${hitsL} · biggest ${bigR}</div>
    <div><b>${escapeHTML(names.right)}</b> — hp ${last.right_hp} · hits landed ${hitsR} · biggest ${bigL}</div>
    <div><b>TOTAL EVENTS</b> ${events.length}</div>`;
}

/* ---------------- audio (synthesized, no asset files needed) ---------------- */
function ac() { return audio || (audio = new (window.AudioContext || window.webkitAudioContext)()); }
function tone(freq, dur, type = 'square', gain = .18, slideTo = null) {
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, c.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + dur);
  g.gain.setValueAtTime(gain, c.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + dur);
  o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + dur);
}
function noise(dur = .25, gain = .3) {
  const c = ac(), n = c.sampleRate * dur, b = c.createBuffer(1, n, c.sampleRate),
        d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 900;
  g.gain.value = gain; s.buffer = b;
  s.connect(f).connect(g).connect(c.destination); s.start();
}
function sfx(kind) {
  try {
    if (kind === 'fight') { tone(220, .12); setTimeout(() => tone(330, .12), 130);
                            setTimeout(() => tone(660, .35, 'square', .2), 270); }
    if (kind === 'hit')   { noise(.22, .32); tone(90, .18, 'sawtooth', .22, 40); }
    if (kind === 'ko')    { tone(180, .9, 'sawtooth', .25, 55); noise(.5, .25); }
    if (kind === 'coin')  { tone(988, .08); setTimeout(() => tone(1319, .22), 90); }
  } catch (e) { /* audio blocked, fine */ }
}

/* ---------------- start / keys ---------------- */
function start() {
  if (started) return;
  started = true;
  sfx('coin');
  $('title').classList.remove('on');
  $('hud').classList.add('on');
  applied = -1;
  const v = $('video');
  if (useVideo) {
    v.play().catch(fallbackClock);
    if (!v.currentSrc) fallbackClock();
    watchdog();
  }
  if (!useVideo) { virtualClock = true; vStart = performance.now(); }
  setTimeout(() => sfx('fight'), 250);
  typeCaption('FIGHT!');
}

function replay() {
  started = false; applied = -1; hits = 0; koDone = false;
  $('over').classList.remove('on'); $('ko').classList.remove('on');
  $('hits').textContent = ''; hideComments(); clearTransients();
  $('caption').textContent = '';
  ['L','R'].forEach(s => $('cores' + s).classList.remove('dead'));
  if (useVideo) $('video').currentTime = 0;
  render(events[0] || {left_hp: 100, right_hp: 100});
  start();
}

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 'c') { $('crt').classList.toggle('on'); return; }
  if (k === 'g') { document.body.classList.toggle('rainbow'); return; }
  if (k === 'r') { replay(); return; }
  if (!started) start();
});
addEventListener('click', e => { if (e.target.tagName !== 'INPUT' && !started) start(); });

$('muted').addEventListener('click', e => {
  e.stopPropagation();
  $('video').muted = false;
  $('muted').classList.remove('on');
});

/* era B: show the ingest command, no backend server */
$('url').addEventListener('input', e => {
  const u = e.target.value.trim();
  const box = $('cmd');
  if (!u) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  box.textContent = `python backend/ingest.py "${u}"`;
});

boot();
requestAnimationFrame(tick);
</script>
